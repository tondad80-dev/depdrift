name: ProcessCore SARIF qualification
on:
  push:
    branches:
      - processcore/sarif-validation-20261112
permissions:
  contents: read
concurrency:
  group: sarif-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
          - os: macos-26
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import platform,sys; print(platform.platform()); print(sys.version)"
      - run: python -m pytest -q
  schema-and-ingestion:
    needs: native-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install -e . jsonschema
      - name: Generate actual CLI report
        run: depdrift review tests/fixtures/old-package-lock.json tests/fixtures/new-package-lock.json --sarif > out.sarif
      - name: Validate the official pinned SARIF schema
        shell: python
        run: |
          import hashlib,json,urllib.request
          from jsonschema import Draft4Validator,FormatChecker
          url="https://raw.githubusercontent.com/oasis-tcs/sarif-spec/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json"
          raw=urllib.request.urlopen(url,timeout=30).read()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert blob=="0f58372b548f60c84d20fca77687435e71b3b3a3",blob
          schema=json.loads(raw)
          Draft4Validator.check_schema(schema)
          document=json.load(open("out.sarif",encoding="utf-8"))
          Draft4Validator(schema,format_checker=FormatChecker()).validate(document)
          assert len(document["runs"][0]["results"])==5
          print("PASS official schema; five actual CLI findings")
      - name: Upload and wait for actual Code Scanning processing
        id: ingest
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          sarif_file: out.sarif
          category: processcore-sarif-qualification
          wait-for-processing: true
      - name: Record accepted SARIF identifier
        env:
          SARIF_ID: ${{ steps.ingest.outputs.sarif-id }}
        run: python -c "import os; value=os.environ.get('SARIF_ID',''); assert value; print('SARIF_ID='+value)"
